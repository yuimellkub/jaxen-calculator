name: Patch rate labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update package labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<span>855 บาท</span>', '<span>855 บาท/แพ็ก</span>', 1)
          s = s.replace('<span>1,430 บาท</span>', '<span>1,430 บาท/แพ็ก</span>', 1)
          s = s.replace('<span>2,770 บาท</span>', '<span>2,770 บาท/แพ็ก</span>', 1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Update special pack labels"
          git push
