name: Patch discount summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch discount summary details
        run: |
          echo '



cyA9IHMucmVwbGFjZSgKIiIiZnVuY3Rpb24gY2FsY3VsYXRlRGlzY291bnRSb3dzKCl7CiAgbGV0IGJ1dHRvbnM9MCwgbm9ybWFsPTAsIGRpc2NvdW50ZWQ9MDsiIiIsCiIiImZ1bmN0aW9uIGNhbGN1bGF0ZURpc2NvdW50Um93cygpewogIGxldCBidXR0b25zPTAsIG5vcm1hbD0wLCBkaXNjb3VudGVkPTA7CiAgY29uc3QgZGV0YWlsUGFydHM9W107IiIiLAopCg


