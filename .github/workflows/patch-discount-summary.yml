      - name: Verify patch
        run: |
          grep -q 'id="sumDetails"' index.html
          grep -q 'id="modalDetails"' index.html
          grep -q 'detailParts.push' index.html
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Show selected packs in discount summary"
